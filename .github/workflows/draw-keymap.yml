name: Draw keymap

on:
  push:
    paths:
      - "config/efogtech_trackball_0.keymap"
      - "config/*.dtsi"
      - "boards/arm/efogtech_trackball_0/buttons.dtsi"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"
      - "keymap-drawer/draw-layout.dtsi"
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core
          python -m pip install keymap-drawer

      - name: Parse and draw keymap
        run: |
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.config.yaml parse \
            -z config/efogtech_trackball_0.keymap \
            > keymap-drawer/keymap.yaml
          # Drop combo dendrons — the arcs read as strikethrough on key labels.
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          p = Path("keymap-drawer/keymap.yaml")
          data = yaml.safe_load(p.read_text())
          for combo in data.get("combos") or []:
              combo["d"] = False
          p.write_text(yaml.dump(data, sort_keys=False, allow_unicode=True))
          PY
          keymap -c keymap_drawer.config.yaml draw \
            -d keymap-drawer/draw-layout.dtsi \
            -l draw_layout \
            keymap-drawer/keymap.yaml \
            > keymap-drawer/keymap.svg
          # Opaque page so GitHub dark mode / PDF viewers don't show black voids
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("keymap-drawer/keymap.svg")
          svg = p.read_text()
          if 'id="page-bg"' not in svg:
              svg = re.sub(
                  r"(<svg\b[^>]*>)",
                  r'\1\n<rect id="page-bg" width="100%" height="100%" fill="#ffffff"/>',
                  svg,
                  count=1,
              )
              p.write_text(svg)
          PY
          # librsvg — CairoSVG mis-renders fonts as huge glyphs
          rsvg-convert -f pdf -b white -o keymap-drawer/keymap.pdf keymap-drawer/keymap.svg

      - name: Upload diagram artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keymap-diagram
          path: |
            keymap-drawer/keymap.svg
            keymap-drawer/keymap.pdf

      - name: Commit updated diagram
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update keymap diagram"
          file_pattern: "keymap-drawer/keymap.svg keymap-drawer/keymap.yaml keymap-drawer/keymap.pdf"
