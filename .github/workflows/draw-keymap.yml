name: Draw keymap

on:
  push:
    paths:
      - "config/efogtech_trackball_0.keymap"
      - "config/*.dtsi"
      - "boards/arm/efogtech_trackball_0/buttons.dtsi"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"
      - "keymap-drawer/draw-layout.dtsi"
      - "keymap-drawer/postprocess_svg.py"
      - "keymap-drawer/prepare_keymap_yaml.py"
      - "keymap-drawer/make_letter_pdf.py"
      - "keymap-drawer/render_previews.py"
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin fonts-dejavu-core poppler-utils
          python -m pip install keymap-drawer pyyaml pillow

      - name: Parse and draw keymap
        run: |
          set -euo pipefail
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.config.yaml parse \
            -z config/efogtech_trackball_0.keymap \
            > keymap-drawer/keymap.yaml
          # Combo labels, sentence-case titles, complexity layer order.
          python3 keymap-drawer/prepare_keymap_yaml.py keymap-drawer/keymap.yaml

          draw() {
            local out="$1"; shift
            local cfg="$1"; shift
            local letter_flag="$1"; shift
            keymap -c "$cfg" draw \
              -d keymap-drawer/draw-layout.dtsi \
              -l draw_layout \
              keymap-drawer/keymap.yaml \
              -s "$@" \
              -o "$out"
            python3 keymap-drawer/postprocess_svg.py $letter_flag "$out"
          }

          # Page 1: portrait 2×3 padded to Letter aspect.
          # Page 2: landscape pyramid (scroll|snipe, centered alt+tab).
          draw keymap-drawer/keymap.svg \
            keymap_drawer.config.yaml --letter \
            default edit media excel system "scroll lock"
          draw keymap-drawer/keymap-page2.svg \
            keymap_drawer.config.yaml --letter-landscape \
            scroll snipe "alt+tab"

          # Page 1 portrait Letter, page 2 landscape Letter.
          python3 keymap-drawer/make_letter_pdf.py \
            keymap-drawer/keymap.svg \
            keymap-drawer/keymap-page2.svg \
            --orientation portrait \
            --orientation landscape \
            -o keymap-drawer/keymap.pdf

          # README landing image: both pages stacked (SVG sanitizer is unreliable).
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image

          pages = []
          for src in ("keymap-drawer/keymap.svg", "keymap-drawer/keymap-page2.svg"):
              tmp = Path(src).with_suffix(".readme-tmp.png")
              subprocess.check_call(
                  ["rsvg-convert", "-f", "png", "-b", "white", "-w", "1400",
                   src, "-o", str(tmp)]
              )
              pages.append(Image.open(tmp).convert("RGB"))
              tmp.unlink()

          gap = 24
          w = max(im.width for im in pages)
          h = sum(im.height for im in pages) + gap * (len(pages) - 1)
          out = Image.new("RGB", (w, h), (255, 255, 255))
          y = 0
          for im in pages:
              out.paste(im, ((w - im.width) // 2, y))
              y += im.height + gap
          out.save("keymap-drawer/keymap.png")
          print(f"keymap.png {out.size[0]}x{out.size[1]}")
          PY

      - name: Upload diagram artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keymap-diagram
          path: |
            keymap-drawer/keymap.svg
            keymap-drawer/keymap-page2.svg
            keymap-drawer/keymap.pdf
            keymap-drawer/keymap.png

      - name: Commit updated diagram
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update keymap diagram"
          file_pattern: >-
            keymap-drawer/keymap.svg
            keymap-drawer/keymap-page2.svg
            keymap-drawer/keymap.yaml
            keymap-drawer/keymap.pdf
            keymap-drawer/keymap.png
