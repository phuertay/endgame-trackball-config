<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Z mouse → trackball — rank shortcuts</title>
<style>
  :root{--bg:#0f1216;--card:#1a1f27;--card2:#212836;--line:#2c3442;--txt:#e6e9ef;--mut:#9aa4b2;--accent:#5b8cff;--drop:#3b2530;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{margin:0 0 4px;font-size:18px}
  .sub{color:var(--mut);font-size:12.5px}
  .wrap{display:flex;gap:18px;padding:18px 22px;align-items:flex-start;flex-wrap:wrap}
  .col{flex:1 1 560px;min-width:340px}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:grab}
  li.dragging{opacity:.4}
  li.drop{background:var(--drop);opacity:.5}
  li.drop .name{text-decoration:line-through}
  .rank{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  li.drop .rank{background:#5a4650}
  .grip{color:var(--mut);cursor:grab;font-size:16px;user-select:none}
  .body{flex:1;min-width:0}
  .name{font-weight:600}
  .meta{color:var(--mut);font-size:12px;margin-top:1px}
  .keys{font-family:ui-monospace,Menlo,Consolas,monospace;color:#c8d3ff}
  .badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);margin-left:6px;vertical-align:middle}
  .b-univ{color:#7ee0a5;border-color:#2f5b43}
  .b-layout{color:#ffcf7a;border-color:#5b4a2f}
  .b-app{color:#ff9db1;border-color:#5b2f3b}
  .b-cat{color:#9db4ff;border-color:#2f3f5b}
  .tb{font-size:11px;color:var(--mut)}
  .keep{cursor:pointer}
  textarea{width:100%;height:420px;background:#0b0e12;color:#cfe0d6;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .hint{color:var(--mut);font-size:12px;margin:6px 0}
  .filterrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--mut)}
  .chip.on{color:#fff;border-color:var(--accent);background:#22314f}
</style>
</head>
<body>
<header>
  <h1>Z mouse → Endgame trackball · rank shortcuts</h1>
  <div class="sub">Drag rows to reorder (top = highest priority / most accessible). Click the ✓ to drop an item. Then <b>Copy ranked list</b> and send it back.</div>
</header>
<div class="wrap">
  <div class="col">
    <div class="filterrow" id="filters"></div>
    <div class="toolbar">
      <button id="dropUnused">Hide dropped at bottom</button>
      <button id="reset">Reset order</button>
      <span class="hint" id="count"></span>
    </div>
    <ul id="list"></ul>
  </div>
  <div class="col">
    <div class="toolbar">
      <label>Export:</label>
      <select id="fmt"><option value="md">Markdown</option><option value="csv">CSV</option><option value="txt">Plain</option></select>
      <button id="copy">Copy ranked list</button>
      <span class="hint" id="copied"></span>
    </div>
    <textarea id="out" readonly></textarea>
  </div>
</div>
<script>
const DATA=[
 {cat:"Editing",name:"Copy",keys:"Ctrl+Insert",btn:"Fingertip L (release)",scope:"Universal",tb:"on TB"},
 {cat:"Editing",name:"Paste",keys:"Shift+Insert",btn:"Fingertip R (release)",scope:"Universal",tb:"on TB"},
 {cat:"Editing",name:"Cut",keys:"Ctrl+X",btn:"L-trigger pull",scope:"Layout",tb:"on TB"},
 {cat:"Editing",name:"Undo",keys:"Ctrl+Z",btn:"Right click (deep)",scope:"Layout",tb:"on TB"},
 {cat:"Editing",name:"Reload",keys:"Ctrl+R",btn:"Right click",scope:"Layout",tb:"—"},
 {cat:"Tabs/Win",name:"Switch window",keys:"Alt+Tab",btn:"L-trigger push",scope:"Universal",tb:"—"},
 {cat:"Tabs/Win",name:"Next tab",keys:"Ctrl+Tab",btn:"R-trigger push",scope:"Universal",tb:"encoder"},
 {cat:"Tabs/Win",name:"Prev tab",keys:"Ctrl+Shift+Tab / Ctrl+PgUp",btn:"Tilt left",scope:"Universal",tb:"encoder"},
 {cat:"Tabs/Win",name:"Next tab (alt)",keys:"Ctrl+PgDn",btn:"Tilt right",scope:"Universal",tb:"—"},
 {cat:"Tabs/Win",name:"Back-tab",keys:"Shift+Tab",btn:"Tilt left",scope:"Universal",tb:"—"},
 {cat:"Tabs/Win",name:"Tab",keys:"Tab",btn:"Tilt right / Right click",scope:"Universal",tb:"partial"},
 {cat:"Tabs/Win",name:"Reopen closed tab",keys:"Ctrl+Shift+T",btn:"Thumb Top",scope:"Layout",tb:"—"},
 {cat:"Tabs/Win",name:"Switch keyboard layout/profile",keys:"(profile jump)",btn:"Thumb Top",scope:"Universal",tb:"bst_tog"},
 {cat:"Nav/Text",name:"Escape",keys:"Esc",btn:"Fingertip L",scope:"Universal",tb:"on TB"},
 {cat:"Nav/Text",name:"Enter",keys:"Enter",btn:"Fingertip R",scope:"Universal",tb:"on TB"},
 {cat:"Nav/Text",name:"Backspace",keys:"Backspace",btn:"Left click",scope:"Universal",tb:"—"},
 {cat:"Nav/Text",name:"Delete",keys:"Del",btn:"L-trigger push",scope:"Universal",tb:"—"},
 {cat:"Nav/Text",name:"Space",keys:"Space",btn:"Middle click",scope:"Universal",tb:"—"},
 {cat:"Nav/Text",name:"Forward (browser)",keys:"Alt+Right",btn:"Thumb Bottom",scope:"Universal",tb:"—"},
 {cat:"Nav/Text",name:"Rename",keys:"F2",btn:"R-trigger push",scope:"Universal",tb:"—"},
 {cat:"Nav/Text",name:"Screenshot",keys:"PrtSc",btn:"Right click (release)",scope:"Universal",tb:"—"},
 {cat:"Media",name:"Volume +",keys:"Vol Up",btn:"Scroll up",scope:"Universal",tb:"on TB"},
 {cat:"Media",name:"Volume −",keys:"Vol Down",btn:"Scroll down",scope:"Universal",tb:"on TB"},
 {cat:"Media",name:"Mute",keys:"Mute",btn:"Middle click",scope:"Universal",tb:"—"},
 {cat:"Media",name:"Play / Pause",keys:"Play/Pause",btn:"Edge Rear",scope:"Universal",tb:"—"},
 {cat:"Media",name:"Next track",keys:"Next",btn:"R-trigger push",scope:"Universal",tb:"—"},
 {cat:"Media",name:"Prev track",keys:"Prev",btn:"L-trigger push",scope:"Universal",tb:"—"},
 {cat:"Pointer",name:"Precision scroll (Ctrl held)",keys:"Ctrl + wheel",btn:"Scroll",scope:"Universal",tb:"partial"},
 {cat:"Pointer",name:"Left-click + Shift held",keys:"Shift + click",btn:"Left click",scope:"Universal",tb:"—"},
 {cat:"App/?",name:"App chord Ctrl+Shift+9 / +5",keys:"Ctrl+Shift+9",btn:"Left click",scope:"App",tb:"—"},
 {cat:"App/?",name:"App chord Shift+Alt+7 / +1",keys:"Shift+Alt+7",btn:"Edge Front",scope:"App",tb:"—"},
 {cat:"App/?",name:"App chord Gui+F13",keys:"Gui+F13",btn:"Fingertip R",scope:"App",tb:"—"},
 {cat:"App/?",name:"App chord Shift+Alt+ (1/3/4/5)",keys:"Shift+Alt+n",btn:"Fingertip R",scope:"App",tb:"—"},
 {cat:"App/?",name:"App macro Ctrl+(… Enter)",keys:"Ctrl + K.Enter / D V Enter / T V Enter",btn:"Fingertip R",scope:"App",tb:"—"},
 {cat:"App/?",name:"App macro Ctrl+Alt+(V F Enter)",keys:"Ctrl+Alt + V F Enter",btn:"Fingertip R",scope:"App",tb:"—"},
 {cat:"App/?",name:"App macro Ctrl+Alt+(V V E Enter)",keys:"Ctrl+Alt + V V E Enter",btn:"Edge Front / Left click",scope:"App",tb:"—"},
 {cat:"App/?",name:"App macro Ctrl+(0 1 / 7 4)",keys:"Ctrl + 0 1",btn:"Middle click",scope:"App",tb:"—"},
 {cat:"App/?",name:"App macro mod+(6 Down Enter)",keys:"Shift/Alt + 6 Down Enter",btn:"Fingertip L",scope:"App",tb:"—"},
];
DATA.forEach((d,i)=>{d.id=i;d.keep=true;});
let order=DATA.map(d=>d.id);
let activeCats=new Set(DATA.map(d=>d.cat));
const scopeClass={Universal:"b-univ",Layout:"b-layout",App:"b-app"};
const list=document.getElementById('list'), out=document.getElementById('out');

function catFilters(){
  const box=document.getElementById('filters');box.innerHTML='';
  [...new Set(DATA.map(d=>d.cat))].forEach(c=>{
    const s=document.createElement('span');s.className='chip on';s.textContent=c;
    s.onclick=()=>{s.classList.toggle('on');activeCats.has(c)?activeCats.delete(c):activeCats.add(c);render();};
    box.appendChild(s);
  });
}
function byId(id){return DATA.find(d=>d.id===id);}
function render(){
  list.innerHTML='';let rank=0;
  order.forEach(id=>{
    const d=byId(id); if(!activeCats.has(d.cat))return;
    const li=document.createElement('li');li.draggable=true;li.dataset.id=id;
    if(!d.keep)li.classList.add('drop'); else rank++;
    li.innerHTML=`<span class="grip">⠿</span>
      <span class="rank">${d.keep?rank:'·'}</span>
      <span class="body"><span class="name">${d.name}</span>
        <span class="badge ${scopeClass[d.scope]||'b-cat'}">${d.scope}</span>
        <span class="badge b-cat">${d.cat}</span>
        <div class="meta"><span class="keys">${d.keys}</span> · ${d.btn} · <span class="tb">${d.tb}</span></div>
      </span>
      <span class="keep" title="keep / drop">${d.keep?'✓':'✗'}</span>`;
    li.querySelector('.keep').onclick=(e)=>{e.stopPropagation();d.keep=!d.keep;render();};
    addDnd(li);
    list.appendChild(li);
  });
  document.getElementById('count').textContent=`${order.filter(id=>byId(id).keep).length} kept / ${DATA.length} total`;
  buildOut();
}
let dragId=null;
function addDnd(li){
  li.addEventListener('dragstart',()=>{dragId=+li.dataset.id;li.classList.add('dragging');});
  li.addEventListener('dragend',()=>{dragId=null;li.classList.remove('dragging');render();});
}
list.addEventListener('dragover',e=>{
  e.preventDefault();
  const after=getAfter(e.clientY);
  const cur=order.filter(id=>id!==dragId);
  let idx = after==null ? cur.length : order.indexOf(after);
  // rebuild order with dragId inserted before `after`
  const rest=order.filter(id=>id!==dragId);
  const pos = after==null?rest.length:rest.indexOf(after);
  rest.splice(pos,0,dragId);
  order=rest;
  // live visual
  const nodes=[...list.children];
  liveRender();
});
function liveRender(){
  // lightweight reorder of DOM without full render (keeps drag smooth)
  order.forEach(id=>{const n=list.querySelector(`li[data-id="${id}"]`);if(n)list.appendChild(n);});
}
function getAfter(y){
  const els=[...list.querySelectorAll('li:not(.dragging)')];
  let closest={o:-Infinity,el:null};
  els.forEach(el=>{const b=el.getBoundingClientRect();const off=y-b.top-b.height/2;
    if(off<0&&off>closest.o){closest={o:off,el};}});
  return closest.el?+closest.el.dataset.id:null;
}
function buildOut(){
  const kept=order.map(byId).filter(d=>d.keep);
  const fmt=document.getElementById('fmt').value;let s='';
  if(fmt==='md'){s='| # | Action | Keys | Z button | Scope |\n|--|--|--|--|--|\n';
    kept.forEach((d,i)=>s+=`| ${i+1} | ${d.name} | \`${d.keys}\` | ${d.btn} | ${d.scope} |\n`);}
  else if(fmt==='csv'){s='rank,action,keys,button,scope\n';
    kept.forEach((d,i)=>s+=`${i+1},"${d.name}","${d.keys}","${d.btn}",${d.scope}\n`);}
  else{kept.forEach((d,i)=>s+=`${i+1}. ${d.name} — ${d.keys}  (${d.btn}, ${d.scope})\n`);}
  const dropped=order.map(byId).filter(d=>!d.keep);
  if(dropped.length){s+='\n# dropped\n';dropped.forEach(d=>s+=(fmt==='csv'?`,,"${d.name}",,\n`:`- ${d.name}\n`));}
  out.value=s;
}
document.getElementById('fmt').onchange=buildOut;
document.getElementById('copy').onclick=()=>{out.select();document.execCommand('copy');
  const c=document.getElementById('copied');c.textContent='copied!';setTimeout(()=>c.textContent='',1500);};
document.getElementById('reset').onclick=()=>{order=DATA.map(d=>d.id);DATA.forEach(d=>d.keep=true);render();};
document.getElementById('dropUnused').onclick=()=>{order=[...order.filter(id=>byId(id).keep),...order.filter(id=>!byId(id).keep)];render();};
catFilters();render();
</script>
</body>
</html>
