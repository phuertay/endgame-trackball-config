parse_config:
  # Tap = center, hold (h) = orange, shifted/2× (s) = blue.
  # Symbols chosen for DejaVu/rsvg coverage (avoid emoji that tofu).
  raw_binding_map:
    "&snlk": {t: "←", h: "◎", s: "2×🔒"}
    "&ltlk": {t: "Esc", h: "↕", s: "2×🔒"}
    "&ltmkp 6 0x70028": {t: "⏎", h: "♪"}
    "&ltmkp 6 ENTER": {t: "⏎", h: "♪"}
    "&cdch 1 0": {t: "⎘", h: "✎", s: "2×↓"}
    "&cdc": {t: "⎘", s: "2×↓"}
    "&mkp MCLK": "●"
    "&mkp LCLK": "◐"
    "&mkp RCLK": "◑"
    "&syslk": {t: "✕", h: "⚙", s: "2×↻"}
    "&kp LA(ESC)": "⌘▶"
    "&kp LA(LS(ESC))": "⌘◀"
    "&bst_copy": "⎘"
    "&bst_paste": "↓"
    "&bst_cut": "✂"
    "&bst_undo": "↶"
    "&pv": "↓123"
    "&unclose": "↻↹"
    "&axlk": {t: "⟷", h: "hold"}
    "&kp RC(A)": "↻"
    "&kp PSCRN": "▣"
    "&kp BSPC": "⌫"
    "&kp DEL": "⌦"
    "&kp SPACE": "␣"
    "&mui_or_dgl": {t: "BLE", s: "2×USB"}
    "&bst_tog ZBS_TOG": "⇄"
    "&af_toggle AF_TOG": "✦"
    "&soft_off": "⏻"
    "&bt BT_CLR": "BT✕"
    "&bt BT_NXT": "BT▶"
    "&bt BT_PRV": "BT◀"
    "&sens P2SM_INC 1": "◉+"
    "&sens P2SM_DEC 1": "◉-"
    "&scrlsens P2SM_INC 1": "↕+"
    "&scrlsens P2SM_DEC 1": "↕-"
    "&tog 3": {t: "🔒↕"}
    "&tog 4": {t: "🔓"}
    "&kp RCTRL": "⊕"
    "&to 0": "⌂"
    "&kp C_PLAY": "▶"
    "&kp C_PREV": "◀◀"
    "&kp C_NEXT": "▶▶"
    "&kp C_VOL_UP": "♪+"
    "&kp C_VOL_DN": "♪-"
    "&kp RC(PG_DN)": "↹▶"
    "&kp RC(PG_UP)": "↹◀"
    "&kp LEFT": "←"
    "&kp RIGHT": "→"
    "&kp UP": "↑"
    "&kp DOWN": "↓"
    "&qat1": "↓fmt"
    "&qat3": "↓ƒx"
    "&qat6": "⎘▣"
    "&qat8": "⇄ᵀ"
    "&ptv": "⇄123"
  trans_legend: ""

draw_config:
  n_columns: 2
  append_colon_to_layer_header: false
  key_h: 64
  key_w: 68
  key_rx: 10
  key_ry: 10
  combo_w: 48
  combo_h: 26
  inner_pad_w: 6
  inner_pad_h: 6
  outer_pad_w: 44
  outer_pad_h: 52
  small_pad: 4
  line_spacing: 1.15
  shrink_wide_legends: 14
  footer_text: "● mid  ◐ left  ◑ right  ⎘ copy  ↓ paste  ·  orange=hold  blue=2×"
  svg_extra_style: |
    svg.keymap {
      font-family: "DejaVu Sans", "Segoe UI Symbol", sans-serif;
      font-size: 18px;
      font-weight: 600;
      fill: #1a1d21;
    }
    rect.layer-frame {
      fill: #fafbfc;
      stroke: #1a1d21;
      stroke-width: 2.5;
    }
    #layer-dividers line {
      stroke: #1a1d21;
      stroke-width: 4;
    }
    rect.key {
      fill: #ffffff;
      stroke: #1a1d21;
      stroke-width: 1.75;
    }
    rect.combo, rect.combo-separate {
      fill: #d8ebff;
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
    rect.held, rect.combo.held {
      fill: #ffe8c8;
      stroke: #c05621;
    }
    rect.ghost, rect.combo.ghost {
      stroke: #a0a6ad;
      stroke-dasharray: 5, 4;
      fill: #f4f5f6;
    }
    text.label {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.03em;
      stroke: #ffffff;
      stroke-width: 6;
      paint-order: stroke;
    }
    text.footer {
      font-size: 11px;
      font-weight: 500;
      fill: #5c6570;
      stroke: none;
    }
    text.key.tap {
      font-size: 22px;
      font-weight: 700;
    }
    text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br, text.combo {
      font-size: 13px;
      font-weight: 700;
    }
    text.hold {
      fill: #c05621;
    }
    text.shifted {
      fill: #2b6cb0;
    }
    text.combo.tap {
      font-size: 12px;
    }
    text.combo.hold, text.combo.shifted {
      font-size: 10px;
    }
    text.trans {
      fill: #c5c9ce;
    }
    path.combo {
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
