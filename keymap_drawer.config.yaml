  n_columns: 2
  append_colon_to_layer_header: false
  glyph_tap_size: 28
  glyph_hold_size: 24
  glyph_shifted_size: 28
  key_h: 64
  key_w: 68
  key_rx: 10
  key_ry: 10
  combo_w: 48
  combo_h: 26
  inner_pad_w: 6
  inner_pad_h: 6
  outer_pad_w: 36
  outer_pad_h: 48
  small_pad: 4
  line_spacing: 1.15
  shrink_wide_legends: 12
  style_layer_activators: false
  footer_text: "orange = hold · blue = double-tap (2×)"
  svg_extra_style: |
    svg.keymap {
      font-family: "DejaVu Sans", "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #1a1d21;
    }
    #layer-dividers line, line.layer-divider-h, line.layer-divider-v {
      stroke: #8b949e;
      stroke-width: 2;
    }
    rect.key {
      fill: #ffffff;
      stroke: #b0b6be;
      stroke-width: 1;
    }
    rect.combo, rect.combo-separate {
      fill: #e8f2fc;
      stroke: #7aa3d4;
      stroke-width: 1;
    }
    rect.held, rect.combo.held {
      fill: #ffe8c8;
      stroke: #c05621;
    }
    rect.ghost, rect.combo.ghost {
      stroke: #a0a6ad;
      stroke-dasharray: 5, 4;
      fill: #f4f5f6;
    }
    text.label {
      font-size: 18px;
      font-weight: 400 !important;
      letter-spacing: 0;
      stroke: #ffffff;
      stroke-width: 5;
      paint-order: stroke;
    }
    text.footer {
      font-size: 11px;
      font-weight: 400;
      fill: #5c6570;
      stroke: none;
    }
    text.key.tap {
      font-size: 14px;
      font-weight: 400;
    }
    text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br, text.combo {
      font-size: 11px;
      font-weight: 400;
    }
    text.hold {
      fill: #c05621;
    }
    text.shifted {
      fill: #2b6cb0;
    }
    text.combo.tap {
      font-size: 11px;
      font-weight: 400;
    }
    text.combo.hold, text.combo.shifted {
      font-size: 9px;
      font-weight: 400;
    }
    text.trans {
      fill: #c5c9ce;
    }
    path.combo {
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
