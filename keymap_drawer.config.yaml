parse_config:
  # Tap = center, hold (h) = orange, shifted/2× (s) = blue.
  # Words + MDI glyphs (glyph_tap_size below). No bold / ALL CAPS.
  raw_binding_map:
    "&snlk": {t: "back", h: "snipe", s: "2× lock"}
    "&ltlk": {t: "$$mdi:keyboard-esc$$", h: "scroll", s: "2× lock"}
    "&ltmkp 6 0x70028": {t: "$$mdi:keyboard-return$$", h: "media"}
    "&ltmkp 6 ENTER": {t: "$$mdi:keyboard-return$$", h: "media"}
    "&cdch 1 0": {t: "$$mdi:content-copy$$", h: "edit", s: "2× paste"}
    "&cdc": {t: "$$mdi:content-copy$$", s: "2× paste"}
    "&mkp MCLK": "mid clk"
    "&mkp LCLK": "left clk"
    "&mkp RCLK": "right clk"
    "&syslk": {t: "$$mdi:close$$", h: "system", s: "2× reload"}
    "&kp LA(ESC)": "app"
    "&kp LA(LS(ESC))": "app"
    "&bst_copy": "$$mdi:content-copy$$"
    "&bst_paste": "$$mdi:content-paste$$"
    "&bst_cut": "$$mdi:content-cut$$"
    "&bst_undo": "$$mdi:undo$$"
    "&pv": "$$excel-paste-values$$"
    "&unclose": "reopen\ntab"
    "&axlk": {t: "axis", h: "hold"}
    "&kp RC(A)": "reload"
    "&kp PSCRN": "PrtSc"
    "&kp BSPC": "$$mdi:keyboard-backspace$$"
    "&kp DEL": "$$mdi:backspace-reverse$$"
    "&kp SPACE": "␣"
    "&mui_or_dgl": {t: "ble adv", s: "2× dongle"}
    "&bst_tog ZBS_TOG": "swap\nlayout"
    "&af_toggle AF_TOG": "fx"
    "&soft_off": "$$mdi:power$$"
    "&bt BT_CLR": {t: "$$mdi:bluetooth$$", right: "$$mdi:close$$"}
    "&bt BT_NXT": {t: "$$mdi:bluetooth$$", right: "$$mdi:arrow-down$$"}
    "&bt BT_PRV": {t: "$$mdi:bluetooth$$", right: "$$mdi:arrow-up$$"}
    "&sens P2SM_INC 1": "sens +"
    "&sens P2SM_DEC 1": "sens -"
    "&scrlsens P2SM_INC 1": "scrl +"
    "&scrlsens P2SM_DEC 1": "scrl -"
    "&kp RCTRL": "zoom"
    # Explicit return-to-default (excel/media pos7 — same physical spot).
    "&to 0": "$$mdi:home$$"
    "&to LAYER_DEFAULT": "$$mdi:home$$"
    "&kp C_PP": "$$mdi:play-pause$$"
    "&kp C_PLAY": "$$mdi:play-pause$$"
    "&kp C_PREV": "$$mdi:skip-previous$$"
    "&kp C_NEXT": "$$mdi:skip-next$$"
    "&kp C_VOL_UP": "$$mdi:volume-plus$$"
    "&kp C_VOL_DN": "$$mdi:volume-minus$$"
    "&kp RC(PG_DN)": "tab"
    "&kp RC(PG_UP)": "tab"
    "&kp LEFT": "$$mdi:arrow-left$$"
    "&kp RIGHT": "$$mdi:arrow-right$$"
    "&kp UP": "$$mdi:arrow-up$$"
    "&kp DOWN": "$$mdi:arrow-down$$"
    "&qat1": "$$excel-paste-format$$"
    "&qat3": "$$excel-paste-formulas$$"
    "&qat6": "$$excel-copy-picture$$"
    "&qat8": "rev\ntranspose"
    "&ptv": "transpose\nvalues"
  trans_legend: ""

draw_config:
  glyphs:
    excel-paste-values: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#1a1d21" d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M7,7H17V5H19V19H5V5H7V7Z"/><text x="12" y="16.8" text-anchor="middle" font-family="DejaVu Sans" font-size="5.8" font-weight="700" fill="#1a1d21">123</text></svg>'
    excel-paste-format: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#1a1d21" d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M7,7H17V5H19V19H5V5H7V7Z"/><g transform="translate(9.8,10.8) scale(0.48)"><path fill="#1a1d21" d="M18,4V3A1,1 0 0,0 17,2H5A1,1 0 0,0 4,3V7A1,1 0 0,0 5,8H17A1,1 0 0,0 18,7V6H19V10H9V21A1,1 0 0,0 10,22H12A1,1 0 0,0 13,21V12H21V4H18Z"/></g></svg>'
    excel-paste-formulas: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#1a1d21" d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M7,7H17V5H19V19H5V5H7V7Z"/><text x="12" y="17.2" text-anchor="middle" font-family="DejaVu Sans" font-size="8.5" font-style="italic" font-weight="700" fill="#1a1d21">fx</text></svg>'
    excel-copy-picture: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#1a1d21" d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M7,7H17V5H19V19H5V5H7V7Z"/><path fill="#1a1d21" d="M8,9H16V17H8V9M9.5,15.5L11,13.5L12.25,15.1L14,12.5L15.5,15.5H9.5Z"/></svg>'
  n_columns: 2
  append_colon_to_layer_header: false
  glyph_tap_size: 28
  glyph_hold_size: 24
  glyph_shifted_size: 28
  key_h: 64
  key_w: 68
  key_rx: 10
  key_ry: 10
  combo_w: 48
  combo_h: 26
  inner_pad_w: 6
  inner_pad_h: 6
  outer_pad_w: 36
  outer_pad_h: 48
  small_pad: 4
  line_spacing: 1.15
  shrink_wide_legends: 12
  style_layer_activators: false
  footer_text: "orange = hold · blue = double-tap (2×)"
  svg_extra_style: |
    svg.keymap {
      font-family: "DejaVu Sans", "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #1a1d21;
    }
    #layer-dividers line, line.layer-divider-h, line.layer-divider-v {
      stroke: #8b949e;
      stroke-width: 2;
    }
    rect.key {
      fill: #ffffff;
      stroke: #b0b6be;
      stroke-width: 1;
    }
    rect.combo, rect.combo-separate {
      fill: #e8f2fc;
      stroke: #7aa3d4;
      stroke-width: 1;
    }
    rect.held, rect.combo.held {
      fill: #ffe8c8;
      stroke: #c05621;
    }
    rect.ghost, rect.combo.ghost {
      stroke: #a0a6ad;
      stroke-dasharray: 5, 4;
      fill: #f4f5f6;
    }
    text.label {
      font-size: 18px;
      font-weight: 400 !important;
      letter-spacing: 0;
      stroke: #ffffff;
      stroke-width: 5;
      paint-order: stroke;
    }
    text.footer {
      font-size: 11px;
      font-weight: 400;
      fill: #5c6570;
      stroke: none;
    }
    text.key.tap {
      font-size: 14px;
      font-weight: 400;
    }
    text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br, text.combo {
      font-size: 11px;
      font-weight: 400;
    }
    text.hold {
      fill: #c05621;
    }
    text.shifted {
      fill: #2b6cb0;
    }
    text.combo.tap {
      font-size: 11px;
      font-weight: 400;
    }
    text.combo.hold, text.combo.shifted {
      font-size: 9px;
      font-weight: 400;
    }
    text.trans {
      fill: #c5c9ce;
    }
    path.combo {
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
