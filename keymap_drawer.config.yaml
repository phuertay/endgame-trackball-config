parse_config:
  # Tap = center, hold (h) = orange, shifted/2× (s) = blue.
  # Short words + only common symbols (←→↑↓ ▶ ✕).
  raw_binding_map:
    "&snlk": {t: "back", h: "snipe", s: "2× lock"}
    "&ltlk": {t: "esc", h: "scroll", s: "2× lock"}
    "&ltmkp 6 0x70028": {t: "enter", h: "media"}
    "&ltmkp 6 ENTER": {t: "enter", h: "media"}
    "&cdch 1 0": {t: "copy", h: "edit", s: "2× paste"}
    "&cdc": {t: "copy", s: "2× paste"}
    "&mkp MCLK": "mid"
    "&mkp LCLK": "left"
    "&mkp RCLK": "right"
    "&syslk": {t: "close", h: "system", s: "2× reload"}
    "&kp LA(ESC)": "app →"
    "&kp LA(LS(ESC))": "app ←"
    "&bst_copy": "copy"
    "&bst_paste": "paste"
    "&bst_cut": "cut"
    "&bst_undo": "undo"
    "&pv": "paste\nvalues"
    "&unclose": "reopen\ntab"
    "&axlk": {t: "axis", h: "hold"}
    "&kp RC(A)": "reload"
    "&kp PSCRN": "shot"
    "&kp BSPC": "bksp"
    "&kp DEL": "del"
    "&kp SPACE": "space"
    "&mui_or_dgl": {t: "ble", s: "2× usb"}
    "&bst_tog ZBS_TOG": "layout"
    "&af_toggle AF_TOG": "fx"
    "&soft_off": "power"
    "&bt BT_CLR": "bt clear"
    "&bt BT_NXT": "bt →"
    "&bt BT_PRV": "bt ←"
    "&sens P2SM_INC 1": "sens +"
    "&sens P2SM_DEC 1": "sens -"
    "&scrlsens P2SM_INC 1": "scrl +"
    "&scrlsens P2SM_DEC 1": "scrl -"
    "&tog 3": {t: "unlock\nscroll"}
    "&tog 4": {t: "unlock\nsnipe"}
    "&kp RCTRL": "zoom"
    "&to 0": "home"
    "&kp C_PLAY": "play"
    "&kp C_PREV": "prev"
    "&kp C_NEXT": "next"
    "&kp C_VOL_UP": "vol +"
    "&kp C_VOL_DN": "vol -"
    "&kp RC(PG_DN)": "tab →"
    "&kp RC(PG_UP)": "tab ←"
    "&kp LEFT": "←"
    "&kp RIGHT": "→"
    "&kp UP": "↑"
    "&kp DOWN": "↓"
    "&qat1": "paste\nformat"
    "&qat3": "paste\nformulas"
    "&qat6": "copy\npicture"
    "&qat8": "rev\ntranspose"
    "&ptv": "transpose\nvalues"
  trans_legend: ""

draw_config:
  n_columns: 2
  append_colon_to_layer_header: false
  key_h: 64
  key_w: 68
  key_rx: 10
  key_ry: 10
  combo_w: 48
  combo_h: 26
  inner_pad_w: 6
  inner_pad_h: 6
  outer_pad_w: 36
  outer_pad_h: 44
  small_pad: 4
  line_spacing: 1.15
  shrink_wide_legends: 12
  footer_text: "orange = hold · blue = double-tap (2×)"
  svg_extra_style: |
    svg.keymap {
      font-family: "DejaVu Sans", "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #1a1d21;
    }
    rect.key {
      fill: #ffffff;
      stroke: #1a1d21;
      stroke-width: 1.5;
    }
    rect.combo, rect.combo-separate {
      fill: #d8ebff;
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
    rect.held, rect.combo.held {
      fill: #ffe8c8;
      stroke: #c05621;
    }
    rect.ghost, rect.combo.ghost {
      stroke: #a0a6ad;
      stroke-dasharray: 5, 4;
      fill: #f4f5f6;
    }
    text.label {
      font-size: 18px;
      font-weight: 400 !important;
      letter-spacing: 0;
      stroke: #ffffff;
      stroke-width: 5;
      paint-order: stroke;
    }
    text.footer {
      font-size: 11px;
      font-weight: 400;
      fill: #5c6570;
      stroke: none;
    }
    text.key.tap {
      font-size: 14px;
      font-weight: 400;
    }
    text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br, text.combo {
      font-size: 11px;
      font-weight: 400;
    }
    text.hold {
      fill: #c05621;
    }
    text.shifted {
      fill: #2b6cb0;
    }
    text.combo.tap {
      font-size: 11px;
      font-weight: 400;
    }
    text.combo.hold, text.combo.shifted {
      font-size: 9px;
      font-weight: 400;
    }
    text.trans {
      fill: #c5c9ce;
    }
    path.combo {
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
