parse_config:
  # Tap = center, hold (h) = orange, shifted/2× (s) = blue.
  # Words + MDI glyphs (glyph_tap_size below). No bold / ALL CAPS.
  raw_binding_map:
    "&snlk": {t: "back", h: "snipe", s: "2× lock"}
    "&ltlk": {t: "$$mdi:keyboard-esc$$", h: "scroll", s: "2× lock"}
    "&ltmkp 6 0x70028": {t: "$$mdi:keyboard-return$$", h: "media"}
    "&ltmkp 6 ENTER": {t: "$$mdi:keyboard-return$$", h: "media"}
    "&cdch 1 0": {t: "$$mdi:content-copy$$", h: "edit", s: "2× paste"}
    "&cdc": {t: "$$mdi:content-copy$$", s: "2× paste"}
    "&mkp MCLK": "mid clk"
    "&mkp LCLK": "left clk"
    "&mkp RCLK": "right clk"
    "&syslk": {t: "✕", h: "system", s: "2× reload"}
    "&kp LA(ESC)": "app"
    "&kp LA(LS(ESC))": "app"
    "&bst_copy": "$$mdi:content-copy$$"
    "&bst_paste": "$$mdi:content-paste$$"
    "&bst_cut": "$$mdi:content-cut$$"
    "&bst_undo": "$$mdi:undo$$"
    "&pv": {t: "$$mdi:clipboard-text$$", right: "val"}
    "&unclose": "reopen\ntab"
    "&axlk": {t: "axis", h: "hold"}
    "&kp RC(A)": "reload"
    "&kp PSCRN": "PrtSc"
    "&kp BSPC": "$$mdi:keyboard-backspace$$"
    "&kp DEL": "$$mdi:backspace-reverse$$"
    "&kp SPACE": "␣"
    "&mui_or_dgl": {t: "ble adv", s: "2× dongle"}
    "&bst_tog ZBS_TOG": "swap\nlayout"
    "&af_toggle AF_TOG": "fx"
    "&soft_off": "$$mdi:power$$"
    "&bt BT_CLR": {t: "$$mdi:bluetooth$$", right: "✕"}
    "&bt BT_NXT": {t: "$$mdi:bluetooth$$", right: "↓"}
    "&bt BT_PRV": {t: "$$mdi:bluetooth$$", right: "↑"}
    "&sens P2SM_INC 1": "sens +"
    "&sens P2SM_DEC 1": "sens -"
    "&scrlsens P2SM_INC 1": "scrl +"
    "&scrlsens P2SM_DEC 1": "scrl -"
    "&tog 3": {t: "unlock\nscroll"}
    "&tog 4": {t: "unlock\nsnipe"}
    "&kp RCTRL": "zoom"
    "&to 0": "$$mdi:home$$"
    "&kp C_PP": "$$mdi:play-pause$$"
    "&kp C_PLAY": "$$mdi:play-pause$$"
    "&kp C_PREV": "$$mdi:skip-previous$$"
    "&kp C_NEXT": "$$mdi:skip-next$$"
    "&kp C_VOL_UP": "$$mdi:volume-plus$$"
    "&kp C_VOL_DN": "$$mdi:volume-minus$$"
    "&kp RC(PG_DN)": "tab"
    "&kp RC(PG_UP)": "tab"
    "&kp LEFT": "←"
    "&kp RIGHT": "→"
    "&kp UP": "↑"
    "&kp DOWN": "↓"
    "&qat1": {t: "$$mdi:format-paint$$", right: "fmt"}
    "&qat3": {t: "$$mdi:content-paste$$", right: "ƒx"}
    "&qat6": {t: "$$mdi:image$$", right: "copy"}
    "&qat8": "rev\ntranspose"
    "&ptv": "transpose\nvalues"
  trans_legend: ""

draw_config:
  n_columns: 2
  append_colon_to_layer_header: false
  glyph_tap_size: 28
  glyph_hold_size: 24
  glyph_shifted_size: 20
  key_h: 64
  key_w: 68
  key_rx: 10
  key_ry: 10
  combo_w: 48
  combo_h: 26
  inner_pad_w: 6
  inner_pad_h: 6
  outer_pad_w: 36
  outer_pad_h: 48
  small_pad: 4
  line_spacing: 1.15
  shrink_wide_legends: 12
  style_layer_activators: false
  footer_text: "orange = hold · blue = double-tap (2×)"
  svg_extra_style: |
    svg.keymap {
      font-family: "DejaVu Sans", "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #1a1d21;
    }
    #layer-dividers line, line.layer-divider-h, line.layer-divider-v {
      stroke: #8b949e;
      stroke-width: 2;
    }
    rect.key {
      fill: #ffffff;
      stroke: #b0b6be;
      stroke-width: 1;
    }
    rect.combo, rect.combo-separate {
      fill: #e8f2fc;
      stroke: #7aa3d4;
      stroke-width: 1;
    }
    rect.held, rect.combo.held {
      fill: #ffe8c8;
      stroke: #c05621;
    }
    rect.ghost, rect.combo.ghost {
      stroke: #a0a6ad;
      stroke-dasharray: 5, 4;
      fill: #f4f5f6;
    }
    text.label {
      font-size: 18px;
      font-weight: 400 !important;
      letter-spacing: 0;
      stroke: #ffffff;
      stroke-width: 5;
      paint-order: stroke;
    }
    text.footer {
      font-size: 11px;
      font-weight: 400;
      fill: #5c6570;
      stroke: none;
    }
    text.key.tap {
      font-size: 14px;
      font-weight: 400;
    }
    text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br, text.combo {
      font-size: 11px;
      font-weight: 400;
    }
    text.hold {
      fill: #c05621;
    }
    text.shifted {
      fill: #2b6cb0;
    }
    text.combo.tap {
      font-size: 11px;
      font-weight: 400;
    }
    text.combo.hold, text.combo.shifted {
      font-size: 9px;
      font-weight: 400;
    }
    text.trans {
      fill: #c5c9ce;
    }
    path.combo {
      stroke: #2b6cb0;
      stroke-width: 1.5;
    }
