CONFIG_LOG_MAX_LEVEL=3
CONFIG_ZMK_STUDIO_LOCKING=y
# Deep sleep enabled at ZMK's default timeouts (idle 30 s, sleep 15 min).
CONFIG_ZMK_SLEEP=y
CONFIG_POINTER_2S_MIXER_ENSURE_SYNC=y
# Default to the highest polling rate: 1 ms report sync window = 1000 Hz
# (values-ms steps are <0 1 2 4 6 8>; 0 = uncapped). Cycle at runtime with &rrl.
CONFIG_ZMK_INPUT_PROCESSOR_REPORT_RATE_LIMIT_DEFAULT=1
