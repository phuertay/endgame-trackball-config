CONFIG_LOG_MAX_LEVEL=3

# --- Memory reclaim: drop the ZMK Studio + keymap-shell cluster ---
# We don't use Studio (live remapping) or on-device keymap slots. Turning off
# Studio and keymap-shell also drops keymap-settings-storage (its deps go away),
# which frees ~14 KB flash + RAM AND removes the on-device keymap persistence
# that used to shadow flashed keymaps. KEPT: runtime-config + ble-shell +
# shell-relay (the PC tuning app) and the ESB dongle.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_KEYMAP_SHELL=n

# Deep sleep enabled at ZMK's default timeouts (idle 30 s, sleep 15 min).
CONFIG_ZMK_SLEEP=y
CONFIG_POINTER_2S_MIXER_ENSURE_SYNC=y
# Fresh defaults (settings already saved on-device still win until settings-reset).
CONFIG_POINTER_2S_MIXER_FRAME_SYNC=n
CONFIG_POINTER_2S_MIXER_DEFAULT_MOVE_COEF=40
CONFIG_POINTER_2S_MIXER_DEFAULT_TWIST_COEF=100
# Default to the highest polling rate: 1 ms report sync window = 1000 Hz
# (values-ms steps are <0 1 2 4 6 8>; 0 = uncapped). Cycle at runtime with &rrl.
CONFIG_ZMK_INPUT_PROCESSOR_REPORT_RATE_LIMIT_DEFAULT=1
