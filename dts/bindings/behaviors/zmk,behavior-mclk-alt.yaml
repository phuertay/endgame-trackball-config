description: |
  Middle-button undecided: ball motion holds middle-click; left encoder
  resolves to Left Alt (use with zmk,behavior-middle-encoder-alt).

compatible: "zmk,behavior-mclk-alt"

include: zero_param.yaml

properties:
  motion-threshold:
    type: int
    default: 2
    description: Absolute REL_X/Y value needed to resolve as middle-click hold.
