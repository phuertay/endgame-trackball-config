description: |
  Scroll-axis lock control. Tap toggles Y-only ↔ X-only permanently; hold
  temporarily uses the other axis until release; double-tap releases both
  axes (free X+Y).

compatible: "zmk,behavior-axis-lock"

include: zero_param.yaml

properties:
  tapping-term-ms:
    type: int
    default: 200
    description: >
      Hold longer than this to momentary-swap instead of toggle. Also the
      window after a tap in which a second tap counts as double-tap (release
      both axes).
