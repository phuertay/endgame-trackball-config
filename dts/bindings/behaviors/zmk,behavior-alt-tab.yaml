description: |
  Alt-tab style "swapper" behavior. On the first activation it presses and holds
  a modifier (hold-key) and taps param1; each subsequent activation re-taps
  param1 while the modifier stays held. The modifier is released after
  release-after-ms of no further activations, which is what commits the OS app
  switcher. Designed to be driven repeatedly by an encoder (via the follower).

compatible: "zmk,behavior-alt-tab"

include: one_param.yaml

properties:
  hold-key:
    type: int
    required: true
    description: Encoded keycode of the modifier to hold across activations (e.g. LEFT_ALT).
  release-after-ms:
    type: int
    default: 500
    description: Milliseconds of inactivity after which the held modifier is released.
