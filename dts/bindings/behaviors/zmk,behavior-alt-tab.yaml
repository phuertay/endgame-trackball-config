description: |
  Encoder window cycle. Each activation ensures the hold-key (Left Alt) is
  down, then taps param1. Use Esc and Shift+Esc so Alt+Esc and Alt+Shift+Esc
  rotate the window stack in opposite directions. Those stay inverses after
  the window opens: N clicks one way and N the other return to the same app.
  Alt stays down across activations and releases after release-after-ms.

compatible: "zmk,behavior-alt-tab"

include: one_param.yaml

properties:
  hold-key:
    type: int
    required: true
    description: Encoded keycode of the modifier to hold across activations (e.g. LEFT_ALT).
  release-after-ms:
    type: int
    default: 200
    description: Milliseconds of inactivity after which the held modifier is released.
